services:
  db:
    # Debian-based, not -alpine: musl images fail with 'exec format error'
    # on Docker Desktop's WSL2 backend on this host.
    image: postgres:16
    environment:
      POSTGRES_USER: vero
      POSTGRES_PASSWORD: vero
      POSTGRES_DB: vero
    ports:
      # 5433 on the host: 5432 is already taken by a local Postgres install.
      - "5433:5432"
    volumes:
      - vero-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vero -d vero"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vero-pgdata:
